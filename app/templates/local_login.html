{% extends "base.html" %}{% block title %}现场登录 · 打印集群{% endblock %}
{% block brand %}打印集群 · 现场端{% endblock %}
{% block body %}
<section class="auth-shell">
  <div class="card auth-card">
    <div class="auth-top">
      <div class="eyebrow">Local Console</div>
      <h1>现场打印管理</h1>
      <p>仅供学校局域网内的现场工作人员使用。</p>
    </div>
    <div class="auth-body">
      {% if error %}<div class="err">{{ error }}</div>{% endif %}
      <form method="post">
        <label>现场口令<input name="password" type="password" autocomplete="current-password" placeholder="请输入现场口令" required autofocus></label>
        <button>进入状态墙</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
