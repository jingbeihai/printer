<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3165df"><title>登录 · 绍兴数知学校服务</title>
<link rel="stylesheet" href="/desk/login/login.css">
<link rel="preload" as="image" href="/desk/login/campus.webp">
</head>
<body>
<div class="campus-backdrop" aria-hidden="true">
<img class="campus-art" src="/desk/login/campus.webp" alt="" fetchpriority="high">
<div class="cloud cloud-one"></div><div class="cloud cloud-two"></div>
<img class="branch" src="/desk/login/branch.webp" alt="">
<img class="branch branch-near" src="/desk/login/branch.webp" alt="">
<i class="leaf" style="--x:12%;--size:13px;--duration:21s;--delay:-7s"></i>
<i class="leaf" style="--x:30%;--size:10px;--duration:25s;--delay:-18s"></i>
<i class="leaf" style="--x:48%;--size:17px;--duration:20s;--delay:-3s"></i>
<i class="leaf" style="--x:63%;--size:12px;--duration:26s;--delay:-13s"></i>
<i class="leaf" style="--x:78%;--size:15px;--duration:23s;--delay:-21s"></i>
<i class="leaf" style="--x:94%;--size:11px;--duration:28s;--delay:-10s"></i>
</div>

<header class="header"><div class="mark" aria-hidden="true">知</div><strong>绍兴数知</strong><span class="header-subtitle">学校服务 · 印务台</span><button type="button" class="motion-toggle" aria-pressed="false">暂停动画</button></header>
<main class="layout">
<section class="intro" aria-label="学校服务介绍">
<div class="eyebrow">SMART EDUCATION</div>
<h1>让校园服务更简单<br><span>让智慧教育更进一步</span></h1>
<p>连接学校日常服务与智慧 AI 教育，<br>从每一份教学资料开始，为教与学提供支持。</p>
<div class="scene-space" role="img" aria-label="蓝天、操场与结伴同行的学生，充满青春友情的校园"></div>
<div class="intro-details">
<div class="tags"><span>学校服务</span><span>智慧 AI 教育</span><span>教学资料协同</span></div>
<div class="partners"><div><small>服务企业</small><strong>绍兴数知</strong></div><div><small>合作单位</small><strong>讯飞星火</strong></div></div>
</div>
</section>
<section class="card" aria-labelledby="login-title">
<h2 id="login-title">欢迎登录</h2><p class="subtitle">登录印务台，管理您的教学打印任务</p>
{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="/login" id="login-form">
<label class="field" for="username">用户名<input id="username" name="username" autocomplete="username" placeholder="请输入用户名" required autofocus></label>
<label class="field" for="password">密码<input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required></label>
<label class="remember" for="remember-login"><input type="checkbox" id="remember-login"><span>记住用户名和密码</span></label>
<button class="submit" type="submit">登录印务台</button><p class="local-note">仅在这台设备上记住登录信息</p>
</form>
<p class="foot">还没有账号？ <a href="/register">使用邀请码注册</a></p>
</section>
</main>
<script src="/desk/login/motion.js" defer></script>
<script>
(()=>{
 const form=document.getElementById('login-form'),user=form.elements.username,pass=form.elements.password,remember=document.getElementById('remember-login'),key='canon-print-login';
 try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved&&typeof saved==='object'){user.value=typeof saved.username==='string'?saved.username:'';pass.value=typeof saved.password==='string'?saved.password:'';remember.checked=true}}catch(_){try{localStorage.removeItem(key)}catch(_){}}
 remember.addEventListener('change',()=>{if(!remember.checked){try{localStorage.removeItem(key)}catch(_){}}});
 form.addEventListener('submit',()=>{try{if(remember.checked)localStorage.setItem(key,JSON.stringify({username:user.value,password:pass.value}));else localStorage.removeItem(key)}catch(_){}});
})();
</script>
</body>
</html>
